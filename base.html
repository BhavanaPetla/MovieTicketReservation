<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineTick Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100">
    <nav class="p-5 bg-gray-900 border-b border-gray-800 flex justify-between items-center">
        <a href="/" class="text-2xl font-black text-red-600 italic">CINETICK</a>
        <div class="space-x-6 font-bold text-sm">
            <a href="/" class="hover:text-red-500">Home</a>
            {% if session.username %}
                <a href="/dashboard" class="hover:text-red-500">My Tickets</a>
                <a href="/logout" class="bg-red-600 px-4 py-2 rounded-lg">Logout ({{ session.username }})</a>
            {% else %}
                <a href="/login" class="hover:text-red-500">Login</a>
                <a href="/register" class="border border-red-600 px-4 py-2 rounded-lg">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="max-w-6xl mx-auto p-6">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
